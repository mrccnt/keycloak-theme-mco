# Account console in the style of the login theme.
# keycloak.v3 is only the parent for its messages; index.ftl replaces the React console
# with a small page that talks to the Account REST API (common/resources/js/account.js).
parent=keycloak.v3
darkMode=false

title=Account

# CSS, fonts, images, icons and JS are shared with the login theme (common/resources)
sharedResources=common/keycloak-theme-mco
sharedStyles=css/theme.css
sharedScripts=js/account.js

# Page images (common/resources/img)
heroImage-home=img/image_1.webp
heroImage-logout=img/image_2.webp
